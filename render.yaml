services:
  - type: web
    name: vyapar-bandhu-api
    runtime: java
    plan: free
    buildCommand: cd backend && ./gradlew build -x test
    startCommand: cd backend && java -jar build/libs/vyapar-bandhu-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/v1/ai/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false      # You set this manually in Render dashboard
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false      # You set this manually in Render dashboard
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: SERVER_PORT
        value: 8080
