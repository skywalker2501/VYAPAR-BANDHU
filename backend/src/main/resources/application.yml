spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: super_secure_random_base64_string_required_min_256_bits_for_vyaparbandhu
  expirationMs: 86400000

llm:
  apiKey: ""
  apiUrl: https://text.pollinations.ai/openai
  model: openai
